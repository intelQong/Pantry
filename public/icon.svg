<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="0.5" stop-color="#FF4F6E"/>
      <stop offset="1" stop-color="#7B3FF2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FFE29A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE29A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="body"><rect x="314" y="334" width="396" height="472" rx="96"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#3B0A5C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <g filter="url(#shadow)" transform="translate(512 517) scale(1.1) translate(-512 -517)">
    <!-- glass -->
    <rect x="300" y="320" width="424" height="500" rx="110" fill="#FFFFFF" fill-opacity="0.34"/>
    <!-- contents -->
    <g clip-path="url(#body)">
      <path d="M300 690 C 400 660, 520 720, 724 676 V 830 H 300 Z" fill="#2DD4A3"/>
      <path d="M300 600 C 420 570, 560 630, 724 590 V 700 C 560 736, 420 676, 300 706 Z" fill="#FFD43B"/>
      <path d="M300 520 C 430 490, 560 548, 724 506 V 600 C 560 640, 420 580, 300 610 Z" fill="#8B5CF6"/>
      <circle cx="420" cy="760" r="16" fill="#FFFFFF" fill-opacity="0.35"/>
      <circle cx="600" cy="745" r="11" fill="#FFFFFF" fill-opacity="0.35"/>
      <circle cx="520" cy="650" r="12" fill="#FFFFFF" fill-opacity="0.35"/>
    </g>
    <rect x="300" y="320" width="424" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-width="30"/>
    <!-- highlight -->
    <rect x="352" y="390" width="26" height="150" rx="13" fill="#FFFFFF" fill-opacity="0.75"/>
    <!-- lid -->
    <rect x="350" y="214" width="324" height="84" rx="42" fill="#FFFFFF"/>
    <rect x="392" y="244" width="240" height="24" rx="12" fill="#FF4F6E" fill-opacity="0.25"/>
  </g>
</svg>
